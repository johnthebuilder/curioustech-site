<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Roscoe's Journal — Searchable Archive</title>
<style>
  :root{ --ink:#23211d; --soft:#6f6a60; --line:#e3dfd5; --paper:#faf9f6; --accent:#b8902f; --mark:#f3e9b8; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,"Iowan Old Style",serif}
  header{position:sticky;top:0;background:rgba(250,249,246,.97);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:18px 20px 14px;z-index:5}
  .back{color:#7c2d2d;text-decoration:none;font-size:13.5px;font-weight:600;font-family:system-ui,sans-serif;display:inline-block;margin-bottom:6px}
  h1{margin:0;font-size:24px;letter-spacing:.01em}
  .ded{margin:2px 0 0;color:var(--soft);font-size:13px;font-style:italic}
  .controls{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  #q{flex:1;min-width:200px;font:15px Georgia,serif;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  #q:focus{outline:none;border-color:var(--accent)}
  select{font:14px Georgia,serif;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .count{color:var(--soft);font-size:13px;white-space:nowrap}
  .dl{color:#7c2d2d;font-size:13px;font-weight:600;font-family:system-ui,sans-serif;text-decoration:none;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
  main{max-width:760px;margin:0 auto;padding:8px 20px 80px}
  .entry{border-bottom:1px solid var(--line);padding:22px 0}
  .entry h2{margin:0 0 4px;font-size:17px;color:var(--accent);font-family:system-ui,sans-serif;font-weight:600}
  .tag{font-size:11px;color:var(--soft);font-style:italic;font-family:system-ui,sans-serif}
  .body{margin-top:8px;white-space:pre-wrap}
  mark{background:var(--mark);padding:0 1px;border-radius:2px}
  .empty{color:var(--soft);text-align:center;padding:60px 0;font-style:italic}
  .hint{color:var(--soft);font-size:12px;text-align:center;padding:24px 0 0}
</style>
</head>
<body>
<header>
  <a class="back" href="./">‹ Roscoe</a>
  <h1>Roscoe's Journal</h1>
  <p class="ded">The collected columns of Roscoe D. Cunningham (1923–2020), The Sumner Press.</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search the columns…  (e.g. Reagan, insurance, Shakespeare, gold standard)" autofocus>
    <select id="yr"><option value="">All years</option></select>
    <span class="count" id="count"></span>
    <a class="dl" href="Roscoes-Journal-Complete.pdf" title="Download the complete Journal as a PDF">PDF ⬇</a>
  </div>
</header>
<main id="out"></main>
<p class="hint" id="hint"></p>
<script src="roscoe-journal-data.js"></script>
<script>
  const E = (window.ROSCOE_ENTRIES || []).slice();
  const out = document.getElementById('out');
  const count = document.getElementById('count');
  const qEl = document.getElementById('q');
  const yrEl = document.getElementById('yr');
  document.getElementById('hint').textContent =
    'THE COMPLETE JOURNAL: ' + E.length + ' columns, 2013–2020 — every Roscoe’s Journal in the full 379-edition online run of The Sumner Press (the other 7 editions carried no column). All read verbatim from the original scans.';

  // year dropdown
  const years = [...new Set(E.map(e => (e.date||'').slice(0,4)).filter(Boolean))].sort();
  for (const y of years){ const o=document.createElement('option'); o.value=y; o.textContent=y; yrEl.appendChild(o); }

  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function hi(text, q){
    const safe = esc(text);
    if(!q) return safe;
    const rx = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return safe.replace(rx,'<mark>$1</mark>');
  }
  function fmt(d){ if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d; const [y,m,da]=d.split('-');
    return ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m]+' '+(+da)+', '+y; }

  function render(){
    const q = qEl.value.trim();
    const yr = yrEl.value;
    const ql = q.toLowerCase();
    const rows = E.filter(e =>
      (!yr || (e.date||'').startsWith(yr)) &&
      (!ql || (e.text+' '+e.head).toLowerCase().includes(ql)));
    count.textContent = rows.length + ' of ' + E.length;
    if(!rows.length){ out.innerHTML = '<p class="empty">No columns match “'+esc(q)+'”.</p>'; return; }
    out.innerHTML = rows.map(e => {
      const tag = e.head.replace(/^\d{4}-\d{2}-\d{2}\s*/,'');
      return '<article class="entry"><h2>'+fmt(e.date)+
        (tag?' <span class="tag">'+esc(tag)+'</span>':'')+'</h2>'+
        '<div class="body">'+hi(e.text, q)+'</div></article>';
    }).join('');
    window.scrollTo(0,0);
  }
  let t; qEl.addEventListener('input', ()=>{clearTimeout(t);t=setTimeout(render,120)});
  yrEl.addEventListener('change', render);
  render();
</script>
</body>
</html>
