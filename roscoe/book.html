<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2118">
<meta name="robots" content="noindex, nofollow">
<title>If You Want to Be Remembered, Write</title>
<style>
  :root{
    --ink:#211c14; --paper:#f6f1e6; --paper2:#efe7d6; --rule:#cdbf9f;
    --accent:#7c2d2d; --muted:#6d6353;
    --serif:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.62;
    font-size:18px;-webkit-font-smoothing:antialiased}
  .progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:30;transition:width .1s}
  .bar{position:sticky;top:0;z-index:20;background:rgba(246,241,230,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding:11px 16px}
  .bar a.back{color:var(--accent);text-decoration:none;font-size:15px;font-weight:600;white-space:nowrap}
  .bar .t{font-size:14px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .bar button{background:var(--paper2);border:1px solid var(--rule);color:var(--ink);border-radius:8px;
    padding:7px 12px;font-family:var(--serif);font-size:14px;cursor:pointer;white-space:nowrap}
  .toc{position:fixed;inset:0;background:rgba(30,25,18,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .toc.on{opacity:1;pointer-events:auto}
  .toc .panel{position:absolute;top:0;right:0;height:100%;width:min(340px,86vw);background:var(--paper);
    border-left:1px solid var(--rule);padding:20px;overflow-y:auto;transform:translateX(100%);transition:transform .24s}
  .toc.on .panel{transform:translateX(0)}
  .toc h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .toc a{display:block;color:var(--ink);text-decoration:none;padding:10px 0;border-bottom:1px solid var(--paper2);font-size:16px}
  .toc a:active{color:var(--accent)}
  main{max-width:39rem;margin:0 auto;padding:26px 22px 90px}
  #book h1{font-size:clamp(27px,7vw,40px);line-height:1.12;font-weight:800;letter-spacing:-.01em;margin:8px 0 6px;text-align:center}
  #book h2{font-size:26px;font-weight:700;margin:2.2em 0 .5em;line-height:1.2;scroll-margin-top:64px}
  #book h3{font-size:17px;font-weight:400;font-style:italic;color:var(--muted);text-align:center;margin:0 0 1.4em}
  #book h2 + p, #book h3 + p{margin-top:.4em}
  #book p{margin:0 0 1.05em;text-align:justify;hyphens:auto}
  #book blockquote{margin:1.2em 0;padding:.2em 0 .2em 1.1em;border-left:3px solid var(--accent);
    font-size:.97em;color:#2e281d}
  #book blockquote .cite{display:block;margin-top:.35em;font-size:.8em;font-style:italic;color:var(--muted)}
  #book hr{border:none;border-top:1px solid var(--rule);margin:2.4em 0}
  #book .brk{text-align:center;color:var(--accent);letter-spacing:.5em;margin:1.6em 0;font-size:.9em}
  #book ul{margin:.4em 0 1.2em 1.1em}
  #book li{margin:.3em 0;font-size:.92em;color:#3a3427}
  #book .sources{font-size:.86em;color:var(--muted)}
  #book strong{font-weight:700}
  .note{max-width:39rem;margin:0 auto;padding:0 22px 40px;color:var(--muted);font-size:14px;font-style:italic;text-align:center}
  .loading{text-align:center;padding:80px 20px;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div class="bar">
  <a class="back" href="./">‹ Roscoe</a>
  <span class="t">If You Want to Be Remembered, Write</span>
  <button id="tocBtn">Chapters</button>
</div>
<div class="toc" id="toc"><div class="panel"><h3>Chapters</h3><nav id="tocNav"></nav></div></div>
<main><div id="book"><div class="loading">Opening the book…</div></div></main>
<p class="note">Draft v1 · Every quotation of Roscoe's Journal is verbatim from the original scans and dated. The narrative between the quotes is a working draft.</p>

<script>
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<em>$2</em>');
}
function render(md){
  const lines = md.replace(/\r/g,'').split('\n');
  const out = []; let i=0; let inSources=false;
  const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const toc=[];
  while(i<lines.length){
    let ln=lines[i];
    if(ln.trim()===''){i++;continue;}
    if(ln.startsWith('# ')){out.push('<h1>'+inline(ln.slice(2))+'</h1>');i++;continue;}
    if(ln.startsWith('### ')){out.push('<h3>'+inline(ln.slice(4))+'</h3>');i++;continue;}
    if(ln.startsWith('## ')){const t=ln.slice(3);const id=slug(t);if(!/^contents$/i.test(t.trim()))toc.push({t,id});inSources=false;
      out.push('<h2 id="'+id+'">'+inline(t)+'</h2>');i++;continue;}
    if(ln.trim()==='---'){out.push('<hr>');i++;continue;}
    if(ln.trim()==='***'){out.push('<div class="brk">✦</div>');i++;continue;}
    if(/^—\s*Sources/i.test(ln.trim())){inSources=true;out.push('<hr><p class="sources"><strong>Sources</strong></p>');i++;continue;}
    if(ln.startsWith('> ')||ln==='>'){ // blockquote: gather contiguous
      const blk=[];
      while(i<lines.length && (lines[i].startsWith('>'))){blk.push(lines[i].replace(/^>\s?/,''));i++;}
      let q=blk.join(' ').trim();
      const m=q.match(/\s*(\([^()]*\))\s*$/);
      let cite='';
      if(m){cite=m[1];q=q.slice(0,m.index).trim();}
      out.push('<blockquote>'+inline(q)+(cite?'<span class="cite">'+inline(cite)+'</span>':'')+'</blockquote>');
      continue;
    }
    if(ln.startsWith('- ')){const items=[];
      while(i<lines.length && lines[i].startsWith('- ')){items.push('<li>'+inline(lines[i].slice(2))+'</li>');i++;}
      out.push('<ul class="'+(inSources?'sources':'')+'">'+items.join('')+'</ul>');continue;}
    // paragraph (gather until blank)
    const para=[ln];i++;
    while(i<lines.length && lines[i].trim()!=='' && !/^[#>\-]/.test(lines[i]) && lines[i].trim()!=='---' && lines[i].trim()!=='***'){para.push(lines[i]);i++;}
    out.push('<p'+(inSources?' class="sources"':'')+'>'+inline(para.join(' '))+'</p>');
  }
  return {html:out.join('\n'), toc};
}
fetch('book.md').then(r=>r.text()).then(md=>{
  const {html,toc}=render(md);
  document.getElementById('book').innerHTML=html;
  document.getElementById('tocNav').innerHTML=toc.map(c=>'<a href="#'+c.id+'">'+esc(c.t)+'</a>').join('');
}).catch(e=>{document.getElementById('book').innerHTML='<p class="loading">Couldn\'t load the book text ('+esc(String(e))+').</p>';});

const toc=document.getElementById('toc');
document.getElementById('tocBtn').onclick=()=>toc.classList.add('on');
toc.onclick=e=>{if(e.target===toc||e.target.tagName==='A')toc.classList.remove('on');};
addEventListener('scroll',()=>{const h=document.documentElement;
  const p=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;
  document.getElementById('prog').style.width=Math.min(100,p)+'%';},{passive:true});
</script>
</body>
</html>
