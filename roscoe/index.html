<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf9f6">
<title>Roscoe's Journal</title>
<meta name="description" content="The collected columns of Roscoe D. Cunningham (1923–2020), The Sumner Press — searchable, and downloadable as a PDF.">
<style>
  :root{ --ink:#23211d; --soft:#6f6a60; --line:#e3dfd5; --paper:#faf9f6; --accent:#b8902f; --wine:#7c2d2d; --mark:#f3e9b8; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,"Iowan Old Style",serif}
  header{position:sticky;top:0;background:rgba(250,249,246,.97);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:16px 20px 12px;z-index:5}
  .kick{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-family:system-ui,sans-serif;margin-bottom:4px}
  h1{margin:0;font-size:26px;letter-spacing:.01em}
  .ded{margin:3px 0 0;color:var(--soft);font-size:13px;font-style:italic}
  .controls{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}
  #q{flex:1;min-width:170px;font:15px Georgia,serif;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  #q:focus{outline:none;border-color:var(--accent)}
  select{font:14px Georgia,serif;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .count{color:var(--soft);font-size:13px;white-space:nowrap}
  a.dl{display:inline-block;color:#fff;background:var(--wine);font:600 13.5px system-ui,sans-serif;text-decoration:none;
    white-space:nowrap;border-radius:8px;padding:9px 13px;box-shadow:0 2px 8px -4px rgba(0,0,0,.4)}
  a.dl:active{transform:scale(.98)}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .entry{border-bottom:1px solid var(--line);padding:22px 0}
  .entry h2{margin:0 0 4px;font-size:17px;color:var(--accent);font-family:system-ui,sans-serif;font-weight:600}
  .tag{font-size:11px;color:var(--soft);font-style:italic;font-family:system-ui,sans-serif}
  .body{margin-top:8px;white-space:pre-wrap}
  mark{background:var(--mark);padding:0 1px;border-radius:2px}
  .empty{color:var(--soft);text-align:center;padding:60px 0;font-style:italic}
  .hint{color:var(--soft);font-size:12px;text-align:center;padding:24px 20px 8px;max-width:760px;margin:0 auto}
  footer{color:var(--soft);font-size:12.5px;text-align:center;padding:10px 20px 46px;font-style:italic}
  .fail{max-width:560px;margin:40px auto;padding:0 20px;text-align:center;color:var(--soft)}
  .fail a{color:var(--wine);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="kick">The Sumner Press · Sumner, Illinois</div>
  <h1>Roscoe's Journal</h1>
  <p class="ded">The collected columns of Roscoe D. Cunningham (1923–2020).</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search the columns…  (e.g. Nuremberg, insurance, Shakespeare)">
    <select id="yr"><option value="">All years</option></select>
    <span class="count" id="count"></span>
    <a class="dl" href="Roscoes-Journal-Complete.pdf">⬇&nbsp;Download the PDF</a>
  </div>
</header>
<noscript><div class="fail"><p>This page needs JavaScript to show the columns — or simply
  <a href="Roscoes-Journal-Complete.pdf">download the complete Journal as a PDF</a> (all 372 columns, one file).</p></div></noscript>
<main id="out"></main>
<p class="hint" id="hint"></p>
<footer>"To be remembered, write." — Gathered by his grandson · 2026</footer>
<script src="roscoe-journal-data.js"></script>
<script>
  var E = (window.ROSCOE_ENTRIES || []).slice();
  var out = document.getElementById('out');
  var count = document.getElementById('count');
  var qEl = document.getElementById('q');
  var yrEl = document.getElementById('yr');

  if (!E.length) {
    out.innerHTML = '<div class="fail"><p>The columns didn’t load — please reload the page once, or ' +
      '<a href="Roscoes-Journal-Complete.pdf">download the complete Journal as a PDF</a> instead.</p></div>';
  } else {
    document.getElementById('hint').textContent =
      'THE COMPLETE JOURNAL: ' + E.length + ' columns, 2013–2020 — every Roscoe’s Journal in the full 379-edition online run of The Sumner Press (the other 7 editions carried no column). All read verbatim from the original scans.';

    var years = [], seen = {};
    for (var i = 0; i < E.length; i++) { var y = (E[i].date || '').slice(0, 4); if (y && !seen[y]) { seen[y] = 1; years.push(y); } }
    years.sort();
    for (var j = 0; j < years.length; j++) { var o = document.createElement('option'); o.value = years[j]; o.textContent = years[j]; yrEl.appendChild(o); }

    var esc = function (s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    var hi = function (text, q) {
      var safe = esc(text);
      if (!q) return safe;
      var rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return safe.replace(rx, '<mark>$1</mark>');
    };
    var MO = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var fmt = function (d) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
      var p = d.split('-'); return MO[+p[1]] + ' ' + (+p[2]) + ', ' + p[0];
    };
    var entryHtml = function (e, q) {
      var tag = e.head.replace(/^\d{4}-\d{2}-\d{2}\s*/, '');
      return '<article class="entry"><h2>' + fmt(e.date) +
        (tag ? ' <span class="tag">' + esc(tag) + '</span>' : '') + '</h2>' +
        '<div class="body">' + hi(e.text, q) + '</div></article>';
    };

    // Chunked render: paint the first screenfuls instantly, append the rest in
    // background batches — old phones never sit on a blank page.
    var renderRun = 0;
    function render() {
      var run = ++renderRun;
      var q = qEl.value.trim();
      var yr = yrEl.value;
      var ql = q.toLowerCase();
      var rows = [];
      for (var i = 0; i < E.length; i++) {
        var e = E[i];
        if (yr && (e.date || '').slice(0, 4) !== yr) continue;
        if (ql && (e.text + ' ' + e.head).toLowerCase().indexOf(ql) === -1) continue;
        rows.push(e);
      }
      count.textContent = rows.length + ' of ' + E.length;
      if (!rows.length) { out.innerHTML = '<p class="empty">No columns match “' + esc(q) + '”.</p>'; return; }
      var FIRST = 25, STEP = 50;
      var first = [];
      for (var a = 0; a < Math.min(FIRST, rows.length); a++) first.push(entryHtml(rows[a], q));
      out.innerHTML = first.join('');
      window.scrollTo(0, 0);
      var idx = FIRST;
      function more() {
        if (run !== renderRun || idx >= rows.length) return;
        var frag = [];
        for (var b = idx; b < Math.min(idx + STEP, rows.length); b++) frag.push(entryHtml(rows[b], q));
        idx += STEP;
        out.insertAdjacentHTML('beforeend', frag.join(''));
        (window.requestAnimationFrame || setTimeout)(more);
      }
      (window.requestAnimationFrame || setTimeout)(more);
    }
    var t; qEl.addEventListener('input', function () { clearTimeout(t); t = setTimeout(render, 120); });
    yrEl.addEventListener('change', render);
    render();
  }
</script>
</body>
</html>
